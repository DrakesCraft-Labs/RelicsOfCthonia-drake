name: Build and Verify Relics

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        
    - name: Maven Build
      run: mvn clean package --file pom.xml

    - name: Verify plugin artifact
      run: |
        test -f target/RelicsOfCthonia-drake.jar
        jar tf target/RelicsOfCthonia-drake.jar | grep -q '^plugin.yml$'
      
    - name: Upload the artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact-${{ github.event.number }}
        path: 'target/RelicsOfCthonia*.jar'
